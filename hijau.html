<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Panggung Al-Ambiak Original - Tenaga Luar Biasa</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Kopi Panggung Al-Ambiak Original Direct Kilang. Ubat kuat tenaga batin lelaki tradisional. Duit dikembalikan jika palsu!">
    <meta name="keywords" content="Kopi Songkok Original, Kopi Al Ambiak Direct Kilang, Kopi Kuat Lelaki Tradisional">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons (DIJAMIN STABIL UNTUK GITHUB) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#07140e',
                            card: '#0d2218',
                            gold: '#e5c158',
                            red: '#d63031'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (CDN untuk Compile JSX dalam Browser secara kebal) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #07140e; margin: 0; padding: 0; }
        /* Scrollbar cantik */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #07140e; }
        ::-webkit-scrollbar-thumb { background: #e5c158; border-radius: 4px; }
        .goyang-goyang { animation: goyang 2s infinite; }
        @keyframes goyang {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="text-white antialiased selection:bg-brand-gold selection:text-black">
    
    <!-- Loading Text sebelum sistem siap dimuat turun -->
    <div id="root">
        <div style="text-align: center; padding: 50px; font-family: sans-serif; color: white;">
            <h2>Sistem Sedang Dimuatkan...</h2>
            <p>Sila tunggu sebentar. Pastikan talian internet anda stabil.</p>
        </div>
    </div>

    <!-- SCRIPT REACT BERMULA DI SINI -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_PRODUCTS = [
          {
            id: 'p1',
            name: 'TRIAL PACK - 5 BUNGKUS',
            description: 'Risau membazir beli tak minum boleh beli pack percubaan dulu, dah rasa serasi baru standby beli 1 Kotak.',
            price: 35.00,
            originalPrice: 50.00,
            image: 'image.png', 
            tag: 'Sale!',
            stock: 50
          },
          {
            id: 'p2',
            name: '1 KOTAK - 20 BUNGKUS',
            description: 'Pilihan paling jimat dan berbaloi untuk amalan harian. 100% Original Direct Kilang.',
            price: 120.00,
            originalPrice: 150.00,
            image: 'image_6.png', 
            tag: 'Best Value',
            stock: 100
          }
        ];

        // Guna FontAwesome class instead of import module
        const TRUST_BADGES = [
          { icon: 'fa-solid fa-truck-fast', title: 'Free Shipping', desc: '2 Kotak Keatas' },
          { icon: 'fa-solid fa-box', title: 'Fast Shipping', desc: 'Bayar Sebelum 12pm' },
          { icon: 'fa-solid fa-leaf', title: 'Bahan Organik', desc: '100% Guarantee' },
          { icon: 'fa-solid fa-shield-halved', title: 'Original Produk', desc: '100% Dari Kilang' }
        ];

        const SOCIAL_PROOF_NAMES = ['Mohd Haikal', 'Zakiah Adnan', 'Ahmad Albab', 'Siti Nurhaliza', 'Faizal Tahir', 'Syafiq R.'];
        const TIME_AGO = ['1 hour ago', '2 hours ago', '5 hours ago', 'Just now', '10 minutes ago'];

        function AdBanner({ slot = "1234567890", format = "auto", clientId = "ca-pub-0000000000000000" }) {
          useEffect(() => {
            try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
          }, []);
          return (
            <div className="w-full my-8 bg-gray-100 border-2 border-dashed border-gray-300 p-4 text-center rounded-xl relative overflow-hidden text-black">
              <p className="text-xs text-gray-400 absolute top-2 left-0 w-full text-center">Advertisement (Google AdSense)</p>
              <div className="pt-6 min-h-[100px] flex items-center justify-center">
                <ins className="adsbygoogle block w-full" data-ad-client={clientId} data-ad-slot={slot} data-ad-format={format} data-full-width-responsive="true"></ins>
              </div>
            </div>
          );
        }

        function App() {
          const [currentView, setCurrentView] = useState('shop');
          const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
          const [successModal, setSuccessModal] = useState(false);
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          
          const [storeSettings, setStoreSettings] = useState({
            whatsapp: "60123456789",
            feeSM: 8.00,
            feeSS: 15.00,
            freeThreshold: 150.00,
            qrCodeUrl: "",
            adsenseClientId: "ca-pub-0000000000000000",
            bankName: "Maybank - KopiViral",
            accNumber: "162204123456"
          });
          
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [popupData, setPopupData] = useState(null);
          const [orders, setOrders] = useState([]);

          // Anti-Snoop Protection (Halang Inspect Element)
          useEffect(() => {
            const handleContextMenu = (e) => e.preventDefault();
            const handleKeyDown = (e) => {
              if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault(); return false;
              }
            };
            document.addEventListener('contextmenu', handleContextMenu);
            document.addEventListener('keydown', handleKeyDown);
            return () => {
              document.removeEventListener('contextmenu', handleContextMenu);
              document.removeEventListener('keydown', handleKeyDown);
            };
          }, []);

          // FB Pixel & GA4 Setup
          useEffect(() => {
            window.fbq = window.fbq || function() { console.log('FB Pixel:', arguments); };
            window.gtag = window.gtag || function() { console.log('GA4 Event:', arguments); };
            window.fbq('track', 'PageView');
          }, []);

          const addToCart = (product) => {
            if (product.stock <= 0) return;
            if(window.fbq) window.fbq('track', 'AddToCart', { content_name: product.name, value: product.price, currency: 'MYR' });
            
            setCart(prev => {
              const existing = prev.find(item => item.id === product.id);
              if (existing) {
                if (existing.qty >= product.stock) return prev;
                return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
              }
              return [...prev, { ...product, qty: 1 }];
            });
            setIsCartOpen(true);
          };

          const updateQty = (id, delta) => {
            setCart(prev => prev.map(item => {
              if (item.id === id) {
                const productRef = products.find(p => p.id === id);
                const newQty = Math.max(1, Math.min(item.qty + delta, productRef?.stock || 99));
                return { ...item, qty: newQty };
              }
              return item;
            }));
          };

          const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
          
          const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
          const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

          useEffect(() => {
            if (currentView !== 'shop') return;
            const showRandomPopup = () => {
              const randomName = SOCIAL_PROOF_NAMES[Math.floor(Math.random() * SOCIAL_PROOF_NAMES.length)];
              const randomProduct = products[Math.floor(Math.random() * products.length)].name;
              const randomTime = TIME_AGO[Math.floor(Math.random() * TIME_AGO.length)];
              setPopupData({ name: randomName, product: randomProduct, time: randomTime });
              setTimeout(() => setPopupData(null), 5000);
            };
            const initialTimer = setTimeout(showRandomPopup, 3000);
            const intervalTimer = setInterval(showRandomPopup, 15000);
            return () => { clearTimeout(initialTimer); clearInterval(intervalTimer); };
          }, [currentView, products]);

          const handleCheckoutComplete = (orderData) => {
            const { name, phone, address, region, grandTotal, receiptBase64 } = orderData;
            const newOrderId = `ORD-${Math.floor(Math.random() * 10000)}`;
            const newOrder = {
              id: newOrderId, customer: name, phone: phone, address: address, region: region, total: grandTotal,
              status: 'Pending Verification', trackingNo: '', receipt: receiptBase64,
              date: new Date().toISOString().split('T')[0]
            };

            setProducts(prevProducts => prevProducts.map(p => {
              const cartItem = cart.find(c => c.id === p.id);
              return cartItem ? { ...p, stock: Math.max(0, p.stock - cartItem.qty) } : p;
            }));

            // Advanced Pixel Matching
            if(window.fbq) window.fbq('track', 'Purchase', { value: grandTotal, currency: 'MYR' }, { fn: name, ph: phone });

            let itemsList = cart.map(item => `- ${item.qty}x ${item.name} (RM ${(item.price * item.qty).toFixed(2)})`).join('\n');
            const waText = `*ORDER BARU DARI WEBSITE (${newOrderId})*\n\n*Pelanggan:*\nNama: ${name}\nTel: ${phone}\nKawasan: ${region}\nAlamat: ${address}\n\n*Pesanan:*\n${itemsList}\n\n*Jumlah: RM ${grandTotal.toFixed(2)}*\n*Resit:* Telah dimuat naik dalam sistem.\n\nSila semak bos!`;
            const waUrl = `https://wa.me/${storeSettings.whatsapp}?text=${encodeURIComponent(waText)}`;
            
            window.open(waUrl, '_blank');
            setOrders([newOrder, ...orders]);
            setCart([]);
            setCurrentView('shop');
            setSuccessModal(true);
          };

          return (
            <div className="min-h-screen bg-brand-dark font-sans text-white pb-12">
              <Navbar cartCount={cartCount} openCart={() => setIsCartOpen(true)} setView={setCurrentView} currentView={currentView} />

              {currentView === 'shop' && (
                <ShopView addToCart={addToCart} popupData={popupData} products={products} adsenseClientId={storeSettings.adsenseClientId} />
              )}

              {currentView === 'checkout' && (
                <CheckoutView cart={cart} cartTotal={cartTotal} goBack={() => setCurrentView('shop')} completeOrder={handleCheckoutComplete} storeSettings={storeSettings} />
              )}

              {currentView === 'admin' && (
                <AdminView orders={orders} isAuthenticated={isAdminAuthenticated} setAuth={setIsAdminAuthenticated} products={products} setProducts={setProducts} storeSettings={storeSettings} setStoreSettings={setStoreSettings} />
              )}

              <CartSidebar isOpen={isCartOpen} close={() => setIsCartOpen(false)} cart={cart} updateQty={updateQty} removeFromCart={removeFromCart} total={cartTotal} proceedToCheckout={() => { setIsCartOpen(false); setCurrentView('checkout'); }} />

              {successModal && (
                <div className="fixed inset-0 flex items-center justify-center z-[100] bg-black bg-opacity-70 px-4 backdrop-blur-sm">
                  <div className="bg-brand-card border border-brand-gold p-8 rounded-3xl text-center max-w-sm w-full mx-auto shadow-2xl">
                    <div className="text-brand-gold mb-4 text-6xl"><i className="fa-solid fa-circle-check"></i></div>
                    <h2 className="text-2xl font-bold mb-2 text-white">Terima Kasih!</h2>
                    <p className="text-gray-300 mb-6">Pesanan anda berjaya direkodkan. Sila semak WhatsApp anda untuk menghantar resit.</p>
                    <button type="button" onClick={() => setSuccessModal(false)} className="bg-brand-gold text-black hover:bg-yellow-500 px-6 py-3 rounded-full font-bold w-full transition-colors shadow-lg">Tutup</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function Navbar({ cartCount, openCart, setView, currentView }) {
          const [mobileMenu, setMobileMenu] = useState(false);
          return (
            <nav className="bg-brand-card shadow-lg sticky top-0 z-40 border-b border-brand-gold/20">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between items-center h-16">
                  <div className="flex items-center cursor-pointer group" onClick={() => setView('shop')}>
                    <i className="fa-solid fa-leaf text-brand-gold text-2xl mr-2 goyang-goyang"></i>
                    <span className="font-bold text-xl tracking-tight text-white">Kopi Al-Ambiak</span>
                  </div>
                  <div className="hidden md:flex space-x-8 items-center">
                    <button type="button" onClick={() => setView('shop')} className={`font-bold transition-colors ${currentView === 'shop' ? 'text-brand-gold' : 'text-gray-300 hover:text-white'}`}>Kedai Utama</button>
                    <button type="button" onClick={() => setView('admin')} className={`font-bold transition-colors ${currentView === 'admin' ? 'text-brand-gold' : 'text-gray-300 hover:text-white'}`}>Admin Panel</button>
                    <button type="button" onClick={openCart} className="relative p-2 text-gray-300 hover:text-brand-gold transition-colors text-xl">
                      <i className="fa-solid fa-cart-shopping"></i>
                      {cartCount > 0 && <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none text-black transform translate-x-1/4 -translate-y-1/4 bg-brand-gold rounded-full shadow-sm">{cartCount}</span>}
                    </button>
                  </div>
                  <div className="flex md:hidden items-center space-x-4">
                    <button type="button" onClick={openCart} className="relative p-2 text-brand-gold text-xl">
                      <i className="fa-solid fa-cart-shopping"></i>
                      {cartCount > 0 && <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none text-black bg-brand-gold rounded-full">{cartCount}</span>}
                    </button>
                    <button type="button" onClick={() => setMobileMenu(!mobileMenu)} className="text-white text-xl">
                      <i className="fa-solid fa-bars"></i>
                    </button>
                  </div>
                </div>
              </div>
              {mobileMenu && (
                <div className="md:hidden bg-brand-dark border-t border-brand-gold/20 px-4 pt-2 pb-4 space-y-2 shadow-lg">
                  <button type="button" onClick={() => { setView('shop'); setMobileMenu(false); }} className="block w-full text-left py-3 px-2 font-bold text-white"><i className="fa-solid fa-store mr-2"></i>Kedai Utama</button>
                  <button type="button" onClick={() => { setView('admin'); setMobileMenu(false); }} className="block w-full text-left py-3 px-2 font-bold text-gray-400"><i className="fa-solid fa-gauge mr-2"></i>Dashboard Admin</button>
                </div>
              )}
            </nav>
          );
        }

        function ShopView({ addToCart, popupData, products, adsenseClientId }) {
          const scrollToProducts = () => {
            const el = document.getElementById('products');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          };

          return (
            <div className="relative overflow-hidden bg-brand-dark">
              {/* Promo Bar */}
              <div className="bg-gradient-to-r from-red-600 to-red-800 text-white text-center py-2.5 px-4 text-xs sm:text-sm font-bold uppercase tracking-widest shadow-md z-10 relative animate-pulse">
                🔥 PROMOSI LELONGAN HQ: 50 KOTAK TERAKHIR SAHAJA HARI INI!
              </div>

              {/* Premium Dark Hero Section (Daripada TXT) */}
              <div className="py-16 px-4 sm:px-6 lg:px-8 text-center relative border-b border-brand-card">
                <div className="max-w-4xl mx-auto relative z-10">
                  <span className="inline-block py-1.5 px-5 rounded-full bg-brand-gold/10 text-brand-gold border border-brand-gold/50 font-bold text-xs sm:text-sm mb-6 uppercase tracking-wider shadow-[0_0_15px_rgba(229,193,88,0.2)]">
                    ⭐ STOK 100% ORIGINAL HQ (KOTAK HIJAU)
                  </span>
                  
                  <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight mb-6 leading-tight uppercase drop-shadow-lg text-white">
                    Kopi Panggung <br className="hidden md:block"/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#f1c40f] to-[#e5c158]">Al-Ambiak</span>
                  </h1>
                  
                  <p className="max-w-2xl mx-auto text-lg text-gray-300 mb-10 font-medium leading-relaxed">
                    Formulasi Ekstrak Herba Semulajadi Gred Premium Untuk Tenaga, Stamina Dan Kecergasan Maksimum Lelaki Sejati.
                  </p>

                  <div className="bg-brand-card border-2 border-brand-gold/30 rounded-2xl p-3 md:p-5 mb-10 max-w-2xl mx-auto shadow-[0_20px_40px_rgba(0,0,0,0.6)] relative overflow-hidden group">
                     <img src="image_6.png" alt="Kopi Songkok Original" className="w-full h-auto rounded-xl shadow-lg object-cover" />
                  </div>

                  <div className="bg-gradient-to-br from-[#0d2218] to-[#123324] border-l-4 border-brand-gold p-6 md:p-8 rounded-r-xl max-w-2xl mx-auto text-left shadow-2xl mb-12 transform hover:scale-[1.02] transition-transform duration-300">
                    <h3 className="text-xl md:text-2xl font-extrabold text-white mb-3">Rasa 'Kaw' Pekat, Penangan Padu!</h3>
                    <p className="text-gray-300 text-sm md:text-base leading-relaxed">
                      Gabungan mantap Tongkat Ali, Guarana, dan Maca yang membantu memulihkan kesegaran tubuh badan seawal satu sachet.
                    </p>
                  </div>
                  
                  <button type="button" onClick={scrollToProducts} className="w-full sm:w-auto bg-gradient-to-b from-[#2ecc71] to-[#25d366] hover:from-[#27ae60] hover:to-[#128C7E] text-white px-10 py-5 rounded-xl font-extrabold shadow-[0_10px_20px_rgba(37,211,102,0.3)] transition-all transform hover:-translate-y-1 text-lg tracking-wide uppercase border border-green-400">
                    LIHAT PAKEJ HARGA SEKARANG
                  </button>
                </div>
              </div>

              {/* Pain Points Section */}
              <div className="py-16 px-4 sm:px-6 lg:px-8 border-b-4 border-brand-gold">
                <div className="max-w-3xl mx-auto">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-center text-white mb-10 uppercase tracking-wide">
                    Selalu Alami Masalah <span className="text-brand-gold">Ini?</span>
                  </h2>
                  
                  <div className="space-y-4 mb-16">
                    {['Badan lemau, lesu & tak bermaya lepas balik kerja', 'Mengantuk tersengguk-sengguk masa memandu jarak jauh', 'Sakit-sakit urat dan lenguh sendi satu badan', 'Isteri mula merungut prestasi di ranjang merudum'].map((pain, i) => (
                      <div key={i} className="bg-[#180a0a] border border-[#3a1515] p-5 rounded-xl flex items-center shadow-md transform transition-all hover:translate-x-2">
                        <i className="fa-solid fa-xmark text-red-500 text-2xl mr-4 shrink-0"></i>
                        <span className="text-[#ff9f9f] font-semibold text-base md:text-lg leading-snug">{pain}</span>
                      </div>
                    ))}
                  </div>

                  <div className="bg-brand-card border border-brand-gold/20 p-6 md:p-10 rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
                     <h2 className="text-2xl md:text-3xl font-extrabold text-center text-white mb-10 uppercase tracking-wide">
                      Kenapa Anda <span className="text-brand-gold">Wajib Cuba?</span>
                     </h2>
                     <div className="space-y-8">
                        {[
                          { title: 'Tenaga Ekstra Serta-Merta', desc: 'Membantu membekalkan stamina berpanjangan supaya kerja harian dan aktiviti malam tak terganggu.' },
                          { title: 'Melancarkan Aliran Darah', desc: 'Herba semulajadi bertindak membantu menyegarkan otot dan membuang angin badan.' },
                          { title: 'Rasa Kopi Kampung Sebenar', desc: 'Tidak terlalu manis, aroma panggang asli yang membangkitkan selera penggemar kopi tegar.' }
                        ].map((benefit, i) => (
                          <div key={i} className="flex gap-5 items-start">
                            <div className="bg-brand-gold/10 text-brand-gold w-14 h-14 rounded-full flex items-center justify-center font-black text-2xl shrink-0 border-2 border-brand-gold/40">
                              {i+1}
                            </div>
                            <div className="pt-1">
                              <h4 className="text-xl font-bold text-white mb-2">{benefit.title}</h4>
                              <p className="text-gray-400 text-sm md:text-base leading-relaxed">{benefit.desc}</p>
                            </div>
                          </div>
                        ))}
                     </div>
                  </div>
                </div>
              </div>

              {/* Trust Badges */}
              <div className="bg-black py-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                  {TRUST_BADGES.map((badge, idx) => (
                    <div key={idx} className="flex flex-col items-center p-4 bg-brand-dark rounded-xl border border-white/5">
                      <i className={`${badge.icon} text-brand-gold text-4xl mb-3`}></i>
                      <h3 className="font-bold text-sm md:text-base text-white">{badge.title}</h3>
                      <p className="text-gray-400 text-xs md:text-sm mt-1">{badge.desc}</p>
                    </div>
                  ))}
                </div>
              </div>

              {}
              <div id="products" className="py-20 bg-white text-black border-t-8 border-brand-gold">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="text-center mb-16">
                    <span className="text-green-600 font-bold uppercase tracking-wider text-sm">Penyelesaian Anda</span>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-neutral-900 mt-2 mb-4">Pilih Pakej Kopi Songkok Anda</h2>
                    <p className="text-neutral-600 max-w-2xl mx-auto">Beli terus secara online dengan selamat. Stok direct kilang.</p>
                  </div>
                  
                  <div className="grid md:grid-cols-2 gap-10 max-w-4xl mx-auto">
                    {products.map(product => (
                      <div key={product.id} className="bg-white rounded-3xl shadow-xl overflow-hidden border-2 border-gray-100 flex flex-col group hover:shadow-2xl transition-all duration-300 hover:border-brand-gold/50">
                        <div className="relative overflow-hidden bg-gray-50 aspect-[4/3] flex items-center justify-center p-6">
                          <div className="absolute top-4 right-4 bg-red-600 text-white text-sm font-bold px-4 py-1.5 rounded-full z-10 shadow-md animate-pulse">
                            {product.tag}
                          </div>
                          <img src={product.image} alt={product.name} className="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-700 ease-in-out"/>
                        </div>
                        <div className="p-8 flex flex-col flex-grow">
                          <h3 className="text-2xl font-extrabold text-neutral-900 mb-2 leading-tight">{product.name}</h3>
                          <div className="flex items-center mb-4">
                            <div className="flex text-yellow-400">
                              {[...Array(5)].map((_, i) => <i key={i} className="fa-solid fa-star"></i>)}
                            </div>
                            <span className="ml-2 text-sm text-gray-500 font-medium">Terjual 1,000+</span>
                          </div>
                          
                          <div className="mb-4">
                            {product.stock > 10 ? (
                              <span className="text-xs font-bold text-green-700 bg-green-100 px-3 py-1 rounded-full border border-green-200">Stok Tersedia: {product.stock}</span>
                            ) : product.stock > 0 ? (

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
